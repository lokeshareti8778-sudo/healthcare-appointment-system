name: Deploy Java Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/java-functionapp.yml'

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  FUNCTION_APP_NAME: function-java

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate deployment settings
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_JAVA_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "ERROR: Missing GitHub Secret AZURE_JAVA_FUNCTIONAPP_PUBLISH_PROFILE"
            exit 1
          fi

      - name: Build Azure Function
        run: |
          mvn --batch-mode --update-snapshots -f java-functionapp/pom.xml clean package

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: function-java
          package: java-functionapp/target/azure-functions/function-java
          publish-profile: ${{ secrets.AZURE_JAVA_FUNCTIONAPP_PUBLISH_PROFILE }}
