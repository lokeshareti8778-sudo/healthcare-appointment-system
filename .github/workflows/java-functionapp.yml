name: Deploy Java Azure Function

on:
  push:
    branches: [main]
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/java-functionapp.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  FUNCTION_APP_NAME: ${{ secrets.AZURE_JAVA_FUNCTIONAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Azure Function package
        working-directory: java-functionapp
        run: mvn --batch-mode --update-snapshots clean package -DfunctionAppName="$FUNCTION_APP_NAME"

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: java-functionapp/target/azure-functions/${{ env.FUNCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_JAVA_FUNCTIONAPP_PUBLISH_PROFILE }}
