name: Build and Deploy Java Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/main_function-java.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  FUNCTION_APP_NAME: 'function-java'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify project
        shell: pwsh
        run: |
          if (!(Test-Path "java-functionapp/pom.xml")) {
            Write-Host "java-functionapp contents:"
            Get-ChildItem java-functionapp
            throw "pom.xml not found!"
          }

      - name: Build Function
        working-directory: java-functionapp
        shell: pwsh
        run: |
          mvn clean package

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse java-functionapp\target

      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: java-functionapp/target/azure-functions/${{ env.FUNCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
