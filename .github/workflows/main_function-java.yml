name: Build and Deploy Java Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/main_function-java.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  FUNCTION_APP_NAME: 'function-java'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven Project
        shell: pwsh
        run: |
          if (!(Test-Path "java-functionapp/pom.xml")) {
            Write-Host "ERROR: pom.xml not found."
            exit 1
          }

      - name: Build Azure Function
        working-directory: java-functionapp
        shell: pwsh
        run: |
          mvn clean package

      - name: Show Build Output
        shell: pwsh
        run: |
          Write-Host "Contents of target folder:"
          Get-ChildItem -Recurse java-functionapp\target

      - name: Verify Deployment Package
        shell: pwsh
        run: |
          if (Test-Path "java-functionapp/target/azure-functions/${{ env.FUNCTION_APP_NAME }}") {
            Write-Host "Deployment package found."
          } else {
            Write-Host "Deployment package NOT found."
            Get-ChildItem -Recurse java-functionapp\target
            exit 1
          }

      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: java-functionapp/target/azure-functions/${{ env.FUNCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
