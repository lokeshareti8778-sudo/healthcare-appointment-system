name: Build and Deploy Java Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/main_function-java.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  FUNCTION_APP_NAME: 'function-java'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Maven Project
        shell: pwsh
        run: |
          if (!(Test-Path "java-functionapp/pom.xml")) {
            Write-Host "ERROR: pom.xml not found."
            exit 1
          }

      - name: Build Azure Function
        working-directory: java-functionapp
        shell: pwsh
        run: |
          mvn clean package

      - name: Show Build Output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse java-functionapp\target

      - name: Verify Deployment Package
        shell: pwsh
        run: |
          if (!(Test-Path "java-functionapp/target/azure-functions/${{ env.FUNCTION_APP_NAME }}")) {
            Write-Error "Deployment package not found."
            exit 1
          }

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_27E00F9B640A48279728BD346C0E383F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_077B786C1EF94BB0A8C0ADAEEC37782E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04511FAD843F468CADDCEB2A2020FDE5 }}

      - name: Deploy to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: java-functionapp/target/azure-functions/${{ env.FUNCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
