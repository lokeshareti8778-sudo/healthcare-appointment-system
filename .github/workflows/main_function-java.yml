name: Build and Deploy Java Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/main_function-java.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_FUNCTIONAPP_NAME: function-java
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Java Function project
        shell: pwsh
        run: |
          if (!(Test-Path "java-functionapp/pom.xml")) {
            Write-Error "pom.xml not found in java-functionapp"
            exit 1
          }

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F521763185294E34870C8C87EFE764F4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_88283F2DA83B4EF089E591EA59BA58BD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E8BFA63F641409F93E516E148E49684 }}

      - name: Build Azure Function
        working-directory: java-functionapp
        shell: pwsh
        run: |
          mvn clean package

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: java-functionapp/target/azure-functions/function-java
