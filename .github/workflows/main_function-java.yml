name: Build and Deploy Java Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/main_function-java.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  FUNCTION_APP_NAME: 'function-java'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Azure Function
        working-directory: java-functionapp
        shell: pwsh
        run: mvn clean package

      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: 88798b75-ba90-45c5-87e6-5f56a8680496
          tenant-id: 0c939da3-2338-4621-854b-f42d73bcdf00
          subscription-id: 6dc52c09-2f17-4b9e-9f7e-4f2eef0575b2
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: function-java
          package: java-functionapp/target/azure-functions/function-java
