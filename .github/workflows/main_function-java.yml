name: Build and Deploy Java Azure Function

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/main_function-java.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: function-java
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify Java Function project
        shell: pwsh
        run: |
          if (!(Test-Path "java-functionapp/pom.xml")) {
            Write-Error "pom.xml not found in java-functionapp"
            exit 1
          }

      - name: Build Azure Function
        working-directory: java-functionapp
        shell: pwsh
        run: |
          mvn clean package

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: java-functionapp/target/azure-functions/function-java
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
