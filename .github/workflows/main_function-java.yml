name: Build and deploy Java project to Azure Function App - function-java

on:
  push:
    branches:
      - main
    paths:
      - 'java-functionapp/**'
      - '.github/workflows/main_function-java.yml'

  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: function-java
  PACKAGE_DIRECTORY: java-functionapp
  JAVA_VERSION: '17'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: microsoft

      - name: Verify project structure
        shell: pwsh
        run: |
          Get-ChildItem
          Get-ChildItem java-functionapp
          Test-Path java-functionapp/pom.xml

      - name: Build Java Function
        shell: pwsh
        working-directory: java-functionapp
        run: |
          mvn clean package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_27E00F9B640A48279728BD346C0E383F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_077B786C1EF94BB0A8C0ADAEEC37782E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04511FAD843F468CADDCEB2A2020FDE5 }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: java-functionapp/target/azure-functions/function-java
